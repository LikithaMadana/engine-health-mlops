apiVersion: v1
kind: Service
metadata:
  name: engine-health-service
  labels:
    app: engine-health
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: engine-health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine-health-deployment
  labels:
    app: engine-health
spec:
  replicas: 3
  selector:
    matchLabels:
      app: engine-health
  template:
    metadata:
      labels:
        app: engine-health
    spec:
      containers:
      - name: engine-health-api
        image: engine-health-mlops:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: CNN_MODEL_PATH
          value: "/app/models/cnn_model.pth"
        - name: XGB_MODEL_PATH
          value: "/app/models/xgb_model.pkl"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
